site_name: Mentoria Tecnologia Takwara
site_url: https://takwaratec.github.io/Mentoria_Tecnologia_Takwara/
site_author: Takwara Tech
site_description: Futurismo Ancestral — Arquitetura Vernacular de Alta Tecnologia. Estudo de implantação de mentoria em bambu e poliuretano vegetal.

theme:
  name: material
  logo: assets/images/takwara_logo.png
  favicon: assets/images/takwara_logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: black
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: black
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
  custom_dir: overrides

copyright: '&copy; 2026 Tecnologia Takwara. Todos os direitos reservados.'
extra:
  generator: false

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@10.4.0/dist/mermaid.min.js

plugins:
  - search

nav:
  - Início: index.md
  - Administração e Estratégia:
    - Governança:
      - README do Ecossistema: 04_ADMINISTRACAO_E_ESTRATEGIA/governanca/00_README.md
      - AGENTS.md: 04_ADMINISTRACAO_E_ESTRATEGIA/governanca/01_AGENTS.md
      - Manual de Operação: 04_ADMINISTRACAO_E_ESTRATEGIA/governanca/02_MANUAL_OPERACAO.md
      - Frentes de Trabalho: 04_ADMINISTRACAO_E_ESTRATEGIA/governanca/03_FRENTES_DE_TRABALHO.md
    - Institucional:
      - Modelo de Carta de Intenções: 04_ADMINISTRACAO_E_ESTRATEGIA/institucional/01_carta-intencoes-pesquisador-colaborador-generica.md
      - Apresentação da Mentoria: 04_ADMINISTRACAO_E_ESTRATEGIA/institucional/02_apresentacao-mentoria.md
      - Manual de Observação de Reuniões: 04_ADMINISTRACAO_E_ESTRATEGIA/institucional/03_MANUAL_OBS_REUNIOES.md
    - Administração:
      - Repositórios: 04_ADMINISTRACAO_E_ESTRATEGIA/admin/01_REPOSITORIOS.md
      - Registro de Execuções: 04_ADMINISTRACAO_E_ESTRATEGIA/admin/02_REGISTRO_EXECUCOES.md
    - Relatórios:
      - Índice de Relatórios: 04_ADMINISTRACAO_E_ESTRATEGIA/relatorios/01_README.md
      - Auditoria 2026-07-31: 04_ADMINISTRACAO_E_ESTRATEGIA/relatorios/02_2026-07-31_mentoria_arquitetura_administrativa.md
    - Tarefas:
      - Índice de Tarefas: 04_ADMINISTRACAO_E_ESTRATEGIA/tarefas/01_README.md
    - Planos:
      - Inventário de Ativos GitHub: 04_ADMINISTRACAO_E_ESTRATEGIA/planos/01_INVENTARIO-ATIVOS-GITHUB-2026.md
      - Plano Mestre de Repositórios: 04_ADMINISTRACAO_E_ESTRATEGIA/planos/02_PLANO-MESTRE-ATUALIZACAO-REPOSITORIOS-2026.md
      - Frente UnB/Amazônia+10: 04_ADMINISTRACAO_E_ESTRATEGIA/planos/03_PLANO-FRENTE-09-UNB-MQTF-AMAZONIA10.md
  - Base de Conhecimento:
    - Ecologia e Universo do Bambu: 02_BASE_DE_CONHECIMENTO/TEC_01_Ecologia_e_Universo_do_Bambu.md
    - Tratamentos e a Magia do Boro: 02_BASE_DE_CONHECIMENTO/TEC_02_Tratamentos_e_A_Magia_do_Boro.md
    - O Poliuretano Vegetal e a Bio-Solda: 02_BASE_DE_CONHECIMENTO/TEC_03_O_Poliuretano_Vegetal_e_Aplicacao.md
    - Dossiê Comparativo Biopolímeros: 02_BASE_DE_CONHECIMENTO/TEC_03_Dossie_Comparativo_Biopolimeros.md
    - Engenharia e Escala Industrial: 02_BASE_DE_CONHECIMENTO/TEC_04_Engenharia_e_Escala_Industrial.md
    - Dossiê Tratamentos Bambu: 02_BASE_DE_CONHECIMENTO/TEC_04_Dossie_Tratamentos_Bambu.md
    - Bibliografia e Referências: 02_BASE_DE_CONHECIMENTO/TEC_05_Bibliografia_e_Referencias.md
    - Histórico de Autoridade: 02_BASE_DE_CONHECIMENTO/TEC_06_Historico_Autoridade.md
  - Jornada 7 Passos:
    - Passo 1 - Diagnóstico Persona: 03_JORNADA_7_PASSOS/PASSO_01_Diagnostico_Persona.md
    - Passo 2 - Jornada do Mentorado: 03_JORNADA_7_PASSOS/PASSO_02_Jornada_do_Mentorado.md
    - Passo 3 - Estrutura e Formato: 03_JORNADA_7_PASSOS/PASSO_03_Estrutura_Formato.md
    - Passo 4 - Entrega e Acompanhamento: 03_JORNADA_7_PASSOS/PASSO_04_Entrega_Acompanhamento.md
    - Passo 5 - Precificação: 03_JORNADA_7_PASSOS/PASSO_05_Precificacao.md
    - Passo 6 - Oferta e Naming: 03_JORNADA_7_PASSOS/PASSO_06_Oferta_Naming.md
    - Passo 7 - Imersão de Vendas: 03_JORNADA_7_PASSOS/PASSO_07_Imersao_Vendas.md
  - Metodologia:
    - Ecossistema de Ferramentas: 00_METODOLOGIA/ecossistema-ferramentas.html
    - Manual de Parceria: 00_METODOLOGIA/manual-parceria.html
    - DIA 06 — Finalização da Oferta: 00_METODOLOGIA/DIA_06_Finalizacao_Oferta.md

