  - id: FR-UNB-AMAZONIA
    nome: UnB / Desafios Amazônia
    repositorio: REPO-UNB-DESAFIOS-AMAZONIA
    status: pre-proposta
    observacao: "Desafios da Amazônia (Amazônia+10). Pré-proposta 01/09. Carreira LaPCiS/UnB."

  - id: FR-ECO-PRANCHA
    nome: Eco Prancha
    repositorio: REPO-ECO-PRANCHA
    status: aguardando-call
    observacao: "Prancha de surf 100% vegetal. Marcello Pedro (Grupo Raízes) + Fabio."

  - id: FR-ACERVO
    nome: Acervo Científico
    repositorio: REPO-ACERVO
    status: ativo
    observacao: "Fichas científicas (8 seções Cavichioli), resenhas, estados da arte, perfis. Fonte única de referências."

  - id: FR-PERSONAGENS-BAMBU
    nome: Personagens-Bambu
    repositorio: REPO-PERSONAGENS-BAMBU
    status: publicado
    observacao: "8 personas bambu + biotipos. Material de divulgação e formação."

  - id: FR-TAKWARA-TECH
    nome: Takwara-Tech (Legacy)
    repositorio: REPO-TAKWARA-TECH
    status: legado
    observacao: "Histórico. NUNCA citar em documentos públicos."

  - id: FR-MQTF
    nome: Mulheres Bioeconomia Amazônia / MQTF
    repositorio: REPO-MQTF-CLONE
    status: latente
    observacao: "MQTF é sigla interna. Em docs públicos: 'projeto de bioeconomia amazônica do consórcio UnB/UFAC/UFRR'."

  - id: FR-CARREIRA-LAPCIS
    nome: Carreira / LaPCiS (Pessoal)
    repositorio: null
    status: pessoal
    observacao: "Frente pessoal. NÃO misturar com projetos parceiros."

# Repositórios sem frente atribuída (a auditar):
#   REPO-RAIOX (Mentoria_Comunidades_RaioX) — confirmar função/estado
#   REPO-VERCEL (takwara-mentoria-vercel) — auditar publicação e dados
#   REPO-DOCMD-TEST (docmd-test-takwara) — definir necessidade; arquivar ou restringir
# Frentes fusionadas (não criam entrada própria):
