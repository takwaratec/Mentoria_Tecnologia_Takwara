# ADMIN/FRENTES.yaml
# Registro canônico de frentes de trabalho do ecossistema Tecnologia Takwara.
# IDs permanentes (FR-*): a posição na lista pode mudar, o ID não.
# Fonte: FRENTES_DE_TRABALHO.md + ADMIN/REPOSITORIOS.yaml (30/07/2026).
# Regra: uma frente = um repositório canônico. NUNCA cruzar documentos.

frentes:

  - id: FR-MENTORIA
    nome: Mentoria (Maestro)
    repositorio: REPO-MENTORIA
    status: ativo
    observacao: "Regência do ecossistema. AGENTS.md master, manual de operação, regras metodológicas."

  - id: FR-ECOSALA
    nome: ECOSALA
    repositorio: REPO-ECOSALA
    status: em-reorganizacao
    observacao: "Coletivo de 12 pesquisadores. Editais suspensos até alinhamento interno."

  - id: FR-FABRICA-MODELO
    nome: Fábrica Modelo (FINEP SP)
    repositorio: REPO-FABRICA-MODELO
    status: aguardando-patrocinadores
    observacao: "Industrialização da construção civil. Reunião IPT realizada; escopo/orçamento/governança aguardando patrocinadores."

  - id: FR-MST-JUVENTUDE
    nome: MST Juventude Solidária
    repositorio: REPO-JUVENTUDE-SOLIDARIA
    status: ativo
    observacao: "Memória do Coletivo Terra Viva, Assentamento Mário Lago. 8 subfrentes."

  - id: FR-LUDMILA-ATHIS
    nome: Ludmila / ATHIS-DF
    repositorio: REPO-LUDMILA-ATHIS
    status: ativo
